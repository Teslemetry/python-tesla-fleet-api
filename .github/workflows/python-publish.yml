name: Publish Python 🐍 distribution 📦 to PyPI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Release
    uses: ./.github/workflows/release.yml
    with:
      package-dir: tesla_fleet_api
      pypi-project-url: https://pypi.org/p/tesla_fleet_api
    permissions:
      id-token: write
      contents: write
